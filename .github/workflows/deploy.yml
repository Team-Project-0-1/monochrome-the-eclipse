name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # E2E render-smoke. Intentionally NOT a `needs:` of deploy — it is observable
  # only by the maintainer, so a flake here must never block the deploy pipeline.
  # ubuntu-latest ships Google Chrome preinstalled (CHROME_BIN=google-chrome); if
  # a future runner image drops it, add a `browser-actions/setup-chrome@v1` step
  # before "Run E2E render-smoke". No ffmpeg needed (no video capture).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E render-smoke
        env:
          CHROME_BIN: google-chrome
        run: npm run e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke
          path: output/e2e
          if-no-files-found: ignore

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install asset tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prototype release check and build
        env:
          VITE_BASE_PATH: /monochrome-the-eclipse/
        run: npm run prototype:check

      - name: Validate Pages artifact
        run: node scripts/check-pages-base.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
